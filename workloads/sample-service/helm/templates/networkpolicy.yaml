# Default-deny with two narrow exceptions. sample-service makes zero
# outbound calls of its own (in-memory store, no external dependency), so
# egress is DNS-only — there is nothing else it legitimately needs to reach.
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sample-service.name" . }}
  labels:
    {{- include "sample-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sample-service.labels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Same-namespace traffic — this tenant's own other services/tooling.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    # The OTel collector scraping /metrics (observability/otel-collector).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsScraperNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsScraperPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
