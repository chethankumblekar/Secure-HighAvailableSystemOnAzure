# The one Application a human (or Backstage, in Phase 7) applies by hand:
#   kubectl apply -f platform/argocd/app-of-apps/root-app.yaml
# Everything else — every Application under overlays/<env>/ — is then
# managed declaratively by ArgoCD itself (app-of-apps pattern).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chethankumblekar/tenantforge.git
    targetRevision: HEAD
    path: platform/argocd/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
