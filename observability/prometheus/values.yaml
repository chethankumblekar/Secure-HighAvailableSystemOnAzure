# Helm values for prometheus-community/kube-prometheus-stack, sized for the
# local Tier-1 (kind) cluster this project runs its demos on. See
# observability/prometheus/README.md for the install command.

# kind's control-plane runs as static pods with no matching Kubernetes
# Service the way a kubeadm/managed cluster exposes etcd, the scheduler and
# the controller-manager — these ServiceMonitors never find a scrape target
# on kind and just sit permanently unhealthy. Disabled here; re-enable for a
# real AKS/EKS install (Phase 1/1b), where those endpoints exist.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # This is a single-tenant demo cluster, not a shared one where the
    # chart's default release-label isolation between ServiceMonitors
    # matters — pick up anything in the cluster.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  # Routes the three sample-service SLO alerts (observability/prometheus/
  # slo-rules.yaml) to ai-ops-assistant/webhook_receiver.py running on the
  # host — host.docker.internal is Docker Desktop-specific (macOS/Windows);
  # on Linux, either run kind with `extraMounts`/`--add-host` wiring an
  # equivalent hostname, or deploy the receiver in-cluster instead. See
  # ai-ops-assistant/README.md for how this was actually verified.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname"]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: ai-ops-assistant
          matchers:
            - alertname =~ "SampleService.*"
    receivers:
      - name: "null"
      - name: ai-ops-assistant
        webhook_configs:
          - url: http://host.docker.internal:9095/alerts
            send_resolved: false

grafana:
  adminPassword: admin # local kind demo only — never do this against a real cluster
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
