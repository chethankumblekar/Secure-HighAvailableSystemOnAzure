# eks.amazonaws.com/role-arn is only known after `terraform apply`. See
# docs/demo-script.md for the PLACEHOLDER substitution step (same convention
# used by ../../platform/argocd/overlays/aws/*.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-reporter
  namespace: observability
  annotations:
    eks.amazonaws.com/role-arn: PLACEHOLDER_FINOPS_COST_REPORTER_ROLE_ARN
